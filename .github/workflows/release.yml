name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify package.json version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Debug OIDC claims
        run: |
          # 重建 audience=sigstore（ACTIONS_ID_TOKEN_REQUEST_URL 已带默认 audience=sts.amazonaws.com，
          # 直接 &audience= 追加会冲突返回空，先剥掉 query 再重建）
          URL="${ACTIONS_ID_TOKEN_REQUEST_URL%%\?*}"
          curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${URL}?audience=sigstore" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);c=json.loads(d['value']);print('sub:',c.get('sub'));print('job_workflow_ref:',c.get('job_workflow_ref'));print('repository:',c.get('repository'));print('workflow:',c.get('workflow'))"

      - name: Publish to npm
        run: npm publish --provenance --access public
